# Agent providers, tried in order until one produces a day that passes
# bin/validate-entries.mjs. Format:
#
#   name|base_url|model|token_env_var
#
# An empty base_url means Anthropic directly (subscription OAuth token).
# Everything else is an Anthropic-compatible endpoint, so the same agent
# harness, prompt and tool loop apply unchanged — only the endpoint, model and
# credential differ. Set the token variables in ~/.config/product-diary/env.
#
# Override the order for one run with DIARY_PROVIDERS=zai,deepseek
# Force a single provider with   DIARY_PROVIDERS=deepseek
#
# Model names go stale. List what a provider currently offers with:
#   curl -s https://api.z.ai/api/paas/v4/models -H "Authorization: Bearer $ZAI_API_KEY"
#   curl -s https://api.deepseek.com/models     -H "Authorization: Bearer $DEEPSEEK_API_KEY"
# As of 2026-10-05 z.ai offers glm-4.5 through glm-5.3 (plus 5.3-flash/flashx)
# and DeepSeek offers exactly deepseek-flash and deepseek-v4-pro.
#
# The [1m] suffix declares a 1,048,576-token context window. Claude Code strips
# it before the API call -- verified: the model answers and no "invalid model"
# comes back -- and it exists because Claude Code has no catalog entry for
# either model. Without it Claude Code assumes 200k and autocompacts against
# that, which on 2026-10-07 made deepseek fail outright:
#
#   Autocompact is thrashing: the context refilled to the limit within 3 turns
#   of the previous compact, 3 times in a row.
#   warn: provider deepseek exited 1
#
# Both really are 1M. DeepSeek reports it directly:
#   curl -s https://api.deepseek.com/models -H "Authorization: Bearer $DEEPSEEK_API_KEY"
#     -> deepseek-v4-pro  context_window 1048576, max_output_tokens 393216
# z.ai's listing returns only id/object/created/owned_by, so glm-5.3's window
# comes from OpenRouter (1,048,576 context, 131,072 completion), consistent with
# z.ai's own material describing million-token contexts.
#
# If a model's window is ever genuinely unknown, do NOT guess a [1m]: declaring
# a window larger than the truth stops autocompact firing when it should and
# turns graceful compaction into hard API errors. Prefer
# CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1, which lets the API
# enforce the real limit instead of Claude Code assuming one.
#
claude||claude-sonnet-5-5|CLAUDE_CODE_OAUTH_TOKEN
zai|https://api.z.ai/api/anthropic|glm-5.3[1m]|ZAI_API_KEY
deepseek|https://api.deepseek.com/anthropic|deepseek-v4-pro[1m]|DEEPSEEK_API_KEY
