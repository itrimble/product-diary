# Agent providers, tried in order until one produces a day that passes
# bin/validate-entries.mjs. Format:
#
#   name|base_url|model|token_env_var
#
# An empty base_url means Anthropic directly (subscription OAuth token).
# Everything else is an Anthropic-compatible endpoint, so the same agent
# harness, prompt and tool loop apply unchanged — only the endpoint, model and
# credential differ. Set the token variables in ~/.config/product-diary/env.
#
# Override the order for one run with DIARY_PROVIDERS=zai,deepseek
# Force a single provider with   DIARY_PROVIDERS=deepseek
#
# Model names go stale. List what a provider currently offers with:
#   curl -s https://api.z.ai/api/paas/v4/models -H "Authorization: Bearer $ZAI_API_KEY"
#   curl -s https://api.deepseek.com/models     -H "Authorization: Bearer $DEEPSEEK_API_KEY"
# As of 2026-10-05 z.ai offers glm-4.5 through glm-5.3 (plus 5.3-flash/flashx)
# and DeepSeek offers exactly deepseek-flash and deepseek-v4-pro.
#
claude||claude-sonnet-5-5|CLAUDE_CODE_OAUTH_TOKEN
zai|https://api.z.ai/api/anthropic|glm-5.3|ZAI_API_KEY
deepseek|https://api.deepseek.com/anthropic|deepseek-v4-pro|DEEPSEEK_API_KEY
